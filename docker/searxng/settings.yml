use_default_settings: true

general:
  instance_name: "AI Swarm Search"

search:
  formats:
    - html
    - json

server:
  # Compose supplies SEARXNG_SECRET, overriding this placeholder.
  secret_key: "override-with-SEARXNG_SECRET"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false
  image_proxy: false
